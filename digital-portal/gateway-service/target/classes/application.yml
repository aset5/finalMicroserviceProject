server:
  port: 8080

spring:
  application:
    name: gateway-service
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # Маршрут для логина/регистрации
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # Маршрут для стажировок и данных университета
        - id: university-service
          uri: lb://university-service
          predicates:
            - Path=/api/v1/university/**

        # НОВОЕ: Маршрут для действий админа (одобрение вакансий и т.д.)
        - id: admin-api
          uri: lb://university-service
          predicates:
            - Path=/api/v1/admin/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/