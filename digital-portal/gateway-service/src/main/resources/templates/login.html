<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Digital Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      margin: auto;
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      background: white;
    }
    .btn-success {
      background-color: #28a745;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card login-card p-4 shadow">
    <div class="text-center mb-4">
      <h2 class="text-primary fw-bold">Digital Portal</h2>
      <p class="text-muted small">Войдите, чтобы продолжить работу</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small fw-bold">Email</label>
        <input type="email" class="form-control" id="email" placeholder="admin@gmail.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-bold">Пароль</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-success w-100 mb-3">
        Войти в систему
      </button>
    </form>

    <div class="text-center">
      <a href="/register" class="text-decoration-none small text-muted">Еще нет аккаунта? Регистрация</a>
    </div>
  </div>
</div>

<script>
  // Парсинг JWT токена
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(window.atob(base64));
    } catch (e) { return null; }
  }

  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Вход...';

    const credentials = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };

    try {
      const response = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(credentials)
      });

      if (response.ok) {
        const data = await response.json();
        localStorage.setItem('token', data.token);

        const user = parseJwt(data.token);
        console.log("Успешный вход. Роль:", user.role);

        // Редирект на основе роли
        switch(user.role) {
          case 'ADMIN':
            window.location.href = "/admin/panel";
            break;
          case 'STUDENT':
            window.location.href = "/student/dashboard";
            break;
          case 'UNIVERSITY':
            window.location.href = "/university/dashboard";
            break;
          case 'COMPANY':
            window.location.href = "/company/dashboard";
            break;
          default:
            window.location.href = "/";
        }
      } else {
        alert("Ошибка: Неверный логин или пароль");
        btn.disabled = false;
        btn.innerText = "Войти в систему";
      }
    } catch (error) {
      alert("Сервер авторизации недоступен. Проверьте Auth-Service.");
      btn.disabled = false;
      btn.innerText = "Войти в систему";
    }
  };
</script>
</body>
</html>
