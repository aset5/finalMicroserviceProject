<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Регистрация | Digital Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; }
    .register-card { max-width: 450px; margin: 80px auto; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 15px; }
    .btn-primary { background: #4e73df; border: none; padding: 12px; border-radius: 8px; }
    .btn-primary:hover { background: #2e59d9; }
  </style>
</head>
<body>

<div class="container">
  <div class="card register-card p-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Digital Portal</h2>
      <p class="text-muted">Создайте ваш аккаунт</p>
    </div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">Ваша роль</label>
        <select class="form-select" id="role" onchange="toggleUniversity()">
          <option value="STUDENT">Студент</option>
          <option value="UNIVERSITY">Университет</option>
          <option value="COMPANY">Компания / Работодатель</option>
        </select>
      </div>

      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email" required>
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Пароль" required>
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" id="fullName" placeholder="ФИО или Название организации" required>
      </div>

      <div id="universitySection" class="mb-4">
        <label class="form-label text-info small fw-bold">Выберите ваш ВУЗ:</label>
        <select class="form-select border-info" id="universityId">
          <option value="">Загрузка списка...</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold">Зарегистрироваться</button>
    </form>

    <div class="mt-3 text-center">
      <a href="/login" class="text-decoration-none small">Уже есть аккаунт? Войти</a>
    </div>
  </div>
</div>

<script>
  function toggleUniversity() {
    const role = document.getElementById('role').value;
    const section = document.getElementById('universitySection');
    section.style.display = (role === 'STUDENT') ? 'block' : 'none';
  }

  async function loadUniversities() {
    try {
      const res = await fetch('/api/v1/auth/universities');
      const data = await res.json();
      const select = document.getElementById('universityId');
      select.innerHTML = '<option value="">-- Выберите из списка --</option>';
      data.forEach(uni => {
        select.innerHTML += `<option value="${uni.id}">${uni.fullName}</option>`;
      });
    } catch (e) { console.error("Ошибка загрузки вузов", e); }
  }

  document.getElementById('registerForm').onsubmit = async (e) => {
    e.preventDefault();
    const role = document.getElementById('role').value;
    const payload = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      fullName: document.getElementById('fullName').value,
      role: role,
      universityId: role === 'STUDENT' ? document.getElementById('universityId').value : null
    };

    const res = await fetch('/api/v1/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert("Пользователь " + payload.fullName + " успешно создан!");
      window.location.href = "/login";
    } else {
      alert("Ошибка при регистрации");
    }
  };

  window.onload = () => {
    loadUniversities();
    toggleUniversity();
  };
</script>
</body>
</html>
