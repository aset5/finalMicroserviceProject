server:
  port: 8080

spring:
  application:
    name: gateway-service
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # 1. Маршрут для авторизации и пользователей (AUTH-SERVICE)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # 2. Маршрут для АДМИН-панели (UNIVERSITY-SERVICE)
        # Этот маршрут должен быть ВЫШЕ общего маршрута университета
        - id: university-admin-api
          uri: lb://university-service
          predicates:
            - Path=/api/v1/admin/**

        # 3. Маршрут для общих данных стажировок (UNIVERSITY-SERVICE)
        - id: university-service
          uri: lb://university-service
          predicates:
            - Path=/api/v1/university/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/