server:
  port: 8080

spring:
  application:
    name: gateway-service
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: university-service
          uri: lb://university-service
          predicates:
            - Path=/api/v1/university/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/