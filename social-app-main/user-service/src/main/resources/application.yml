spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password

server:
  port: 8081

services:
  user:
    url: http://localhost:8081
  profile:
    url: http://localhost:8082
  post:
    url: http://localhost:8083
  notification:
    url: http://localhost:8084
  storage:
    url: http://localhost:8085